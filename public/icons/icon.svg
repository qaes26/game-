<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0a1538"/>
      <stop offset="50%" stopColor="#070e24"/>
      <stop offset="100%" stopColor="#030612"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="30%" stopColor="#facc15"/>
      <stop offset="70%" stopColor="#eab308"/>
      <stop offset="100%" stopColor="#ca8a04"/>
    </linearGradient>
    
    <linearGradient id="tongueGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stopColor="#ff758c"/>
      <stop offset="50%" stopColor="#ff477e"/>
      <stop offset="100%" stopColor="#c2185b"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#facc15" stroke-width="8"/>
  
  <!-- Outer Magic Aura Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="16 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#facc15" stroke-width="3" opacity="0.3"/>

  <!-- Golden Crown at Top -->
  <path d="M 176 170 L 210 215 L 256 150 L 302 215 L 336 170 L 326 240 L 186 240 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="176" cy="165" r="7" fill="#ffffff"/>
  <circle cx="256" cy="145" r="9" fill="#ffffff"/>
  <circle cx="336" cy="165" r="7" fill="#ffffff"/>

  <!-- Character / Open Smiling Mouth with Tongue -->
  <g transform="translate(0, 30)">
    <!-- Cute Eyes -->
    <ellipse cx="196" cy="235" rx="14" ry="18" fill="#ffffff"/>
    <circle cx="199" cy="232" r="7" fill="#0f172a"/>
    <circle cx="194" cy="228" r="3.5" fill="#ffffff"/>
    
    <ellipse cx="316" cy="235" rx="14" ry="18" fill="#ffffff"/>
    <circle cx="313" cy="232" r="7" fill="#0f172a"/>
    <circle cx="318" cy="228" r="3.5" fill="#ffffff"/>

    <!-- Cheeks Blush -->
    <ellipse cx="160" cy="265" rx="16" ry="10" fill="#f43f5e" opacity="0.5"/>
    <ellipse cx="352" cy="265" rx="16" ry="10" fill="#f43f5e" opacity="0.5"/>

    <!-- Happy Open Mouth -->
    <path d="M 186 270 Q 256 345 326 270 Z" fill="#4a0e2e" stroke="#ff477e" stroke-width="4"/>
    
    <!-- White Teeth -->
    <path d="M 210 270 Q 256 282 302 270" fill="#ffffff" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- Cute 3D Pink Tongue sticking out gently -->
    <path d="M 220 286 C 220 330 292 330 292 286 Z" fill="url(#tongueGrad)" stroke="#c2185b" stroke-width="3"/>
    
    <!-- Tongue midline & shine -->
    <line x1="256" y1="288" x2="256" y2="315" stroke="#ff758c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Golden Stars & Sparkles -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Top Right Star -->
    <path d="M 400 130 L 406 148 L 424 154 L 406 160 L 400 178 L 394 160 L 376 154 L 394 148 Z"/>
    <!-- Left Star -->
    <path d="M 110 210 L 115 224 L 129 229 L 115 234 L 110 248 L 105 234 L 91 229 L 105 224 Z"/>
    <!-- Bottom Star -->
    <path d="M 390 380 L 394 391 L 405 395 L 394 399 L 390 410 L 386 399 L 375 395 L 386 391 Z"/>
  </g>

  <!-- Arabic Title Badge: لُومِي LUMI -->
  <rect x="146" y="405" width="220" height="52" rx="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <text x="256" y="440" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">لُـومِـي LUMI</text>
</svg>
